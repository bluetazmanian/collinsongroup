<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Trip Planner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <span class="brand">Airport <span>Trip</span> Planner</span>
    <div class="bar-actions">
      <button id="theme" class="link theme-toggle" type="button">Dark mode</button>
      <button id="mytrip" class="link" type="button" hidden>My trip</button>
      <button id="signout" class="link" type="button" hidden>Sign out</button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <noscript><p class="panel">This app needs JavaScript.</p></noscript>
</body>
</html>
