<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1540" width="2200" height="1540"><defs><style></style><marker id="ah4b5563" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ah2557d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2557d6"/></marker><marker id="ah21735a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#21735a"/></marker></defs><rect width="2200" height="1540" fill="#f4f5f7"/><text x="60" y="93.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#111827" text-anchor="start">Monitoring and design improvement</text><text x="60" y="152.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#4b5563" text-anchor="start">Each indicator has one primary source. Reviewed evidence leads to a change and a post-release comparison.</text><rect x="60" y="245" width="450" height="125" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="285.0" y="295.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">API Gateway</text><text x="285.0" y="331.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">Final HTTP status + total latency</text><rect x="60" y="415" width="450" height="125" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="285.0" y="465.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">Recommendation Lambda</text><text x="285.0" y="501.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1f2937" text-anchor="middle">Final outcome + catalogue age</text><rect x="60" y="585" width="450" height="125" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="285.0" y="635.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">Worker + age checker</text><text x="285.0" y="671.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1f2937" text-anchor="middle">Refresh, age, model usage + cost</text><rect x="680" y="390" width="570" height="180" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="965.0" y="451.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">CloudWatch</text><text x="965.0" y="491.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#4b5563" text-anchor="middle">Safe logs → metric filters → good/bad counts</text><text x="965.0" y="520.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#4b5563" text-anchor="middle">Platform alarms + independent synthetic journey</text><rect x="1570" y="390" width="560" height="180" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="1850.0" y="451.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">Datadog</text><text x="1850.0" y="491.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#4b5563" text-anchor="middle">Approved AWS metrics + selected redacted logs</text><text x="1850.0" y="520.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#4b5563" text-anchor="middle">SLO trends, burn rate and release comparisons</text><path d="M510,307 L585,307 L585,480 L678,480" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M510,477 L585,477 L585,480 L678,480" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M510,647 L585,647 L585,480 L678,480" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M1250,480 L1568,480" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><text x="1410" y="431.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#4b5563" text-anchor="middle">AWS integration /</text><text x="1410" y="459.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#4b5563" text-anchor="middle">selected forwarding</text><text x="680" y="641.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">Telemetry is filtered before ingestion. Collection gaps and duplicates remain visible.</text><rect x="1570" y="790" width="560" height="140" rx="16" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="1850.0" y="832.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Review evidence</text><text x="1850.0" y="870.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Service measures + quality samples + cost</text><text x="1850.0" y="898.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Customer reports and an improvement hypothesis</text><rect x="60" y="790" width="450" height="140" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="285.0" y="846.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">Customer feedback</text><text x="285.0" y="884.5" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#4b5563" text-anchor="middle">Reviewed, anonymised examples</text><path d="M1850,570 L1850,788" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M510,860 L1568,860" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><text x="1000" y="836.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#4b5563" text-anchor="middle">Product and engineering review</text><rect x="1570" y="1100" width="560" height="140" rx="16" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="1850.0" y="1156.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Approve a bounded change</text><text x="1850.0" y="1194.5" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Rules, prompt, model, cache or capacity</text><rect x="810" y="1100" width="570" height="140" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="1095.0" y="1156.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">Validate against the baseline</text><text x="1095.0" y="1194.5" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1f2937" text-anchor="middle">Replay, load, security and quality checks</text><rect x="60" y="1100" width="560" height="140" rx="16" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="340.0" y="1142.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Release and compare</text><text x="340.0" y="1180.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Human approval; same measures after release</text><text x="340.0" y="1208.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Keep, adjust or reverse the change</text><path d="M1850,930 L1850,1098" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M1570,1170 L1382,1170" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M810,1170 L622,1170" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><path d="M340,1100 L340,1020 L25,1020 L25,477 L58,477" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah4b5563)" stroke-dasharray="8 6"/><text x="60" y="1317.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#4b5563" text-anchor="start">Dashed loop: a released change affects service behaviour. Telemetry export never blocks a recommendation or refresh.</text><text x="60" y="1373.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#4b5563" text-anchor="start" letter-spacing="1.2">LEGEND</text><rect x="60.0" y="1398" width="28" height="23" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="102.0" y="1412.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Decisions and review</text><rect x="580.0" y="1398" width="28" height="23" rx="4" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="622.0" y="1412.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Application processing</text><rect x="1100.0" y="1398" width="28" height="23" rx="4" fill="#111827" stroke="#111827" stroke-width="2"/><text x="1142.0" y="1412.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Persisted data</text><rect x="1620.0" y="1398" width="28" height="23" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="1662.0" y="1412.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Managed/external services and notes</text><path d="M60.0,1463 L108.0,1463" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="125.0" y="1464.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Traveller request / result</text><path d="M753.3333333333334,1463 L801.3333333333334,1463" fill="none" stroke="#21735a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah21735a)"/><text x="818.3333333333334" y="1464.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Catalogue preparation</text><path d="M1446.6666666666667,1463 L1494.6666666666667,1463" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><text x="1511.6666666666667" y="1464.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Supporting flow / dependency</text></svg>