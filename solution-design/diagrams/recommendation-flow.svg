<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1290" width="1920" height="1290"><defs><style></style><marker id="ah2557d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2557d6"/></marker><marker id="ah21735a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#21735a"/></marker><marker id="ah4b5563" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1920" height="1290" fill="#f4f5f7"/><text x="60" y="93.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#111827" text-anchor="start">How a recommendation is decided</text><text x="60" y="152.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#4b5563" text-anchor="start">The visit starts now. Hard constraints filter venues; preferences determine their order.</text><rect x="60" y="420" width="280" height="130" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="200.0" y="473.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">Trip + catalogue</text><text x="200.0" y="508.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1f2937" text-anchor="middle">Validated traveller context</text><polygon points="580,410.0 730.0,485 580,560.0 430.0,485" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/><text x="580" y="473.5" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Catalogue within</text><text x="580" y="503.4" font-family="Arial,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">4-hour limit?</text><polygon points="1040,410.0 1190.0,485 1040,560.0 890.0,485" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/><text x="1040" y="474.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">At least 10 usable</text><text x="1040" y="502.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">minutes remain?</text><rect x="1400" y="420" width="440" height="130" rx="16" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="1620.0" y="458.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">Apply hard constraints</text><text x="1620.0" y="495.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#dbe6fd" text-anchor="middle">Visit fits and venue is not known closed.</text><text x="1620.0" y="522.4" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#dbe6fd" text-anchor="middle">Food meets any required dietary facts.</text><rect x="420" y="230" width="320" height="110" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="580.0" y="272.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">No reliable data</text><text x="580.0" y="308.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1f2937" text-anchor="middle">Explain and offer retry</text><rect x="880" y="230" width="320" height="110" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="1040.0" y="272.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">Head to the gate</text><text x="1040.0" y="308.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1f2937" text-anchor="middle">No venue recommendations</text><path d="M340,485 L428,485" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><path d="M580,410 L580,342" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="610" y="378.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="start">No</text><path d="M730,485 L888,485" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="810" y="461.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="middle">Yes</text><path d="M1040,410 L1040,342" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="1070" y="378.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="start">No</text><path d="M1190,485 L1398,485" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="1295" y="461.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="middle">Yes</text><polygon points="1040,695.0 1190.0,770 1040,845.0 890.0,770" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/><text x="1040" y="773.3" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Any eligible venues?</text><path d="M1620,550 L1620,770 L1192,770" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="1590" y="656.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#2557d6" text-anchor="end">Check eligible venues</text><rect x="420" y="715" width="320" height="110" rx="16" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="580.0" y="757.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">No suitable places</text><text x="580.0" y="793.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1f2937" text-anchor="middle">Explain the constraints</text><path d="M890,770 L742,770" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="810" y="746.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="middle">No</text><path d="M1040,845 L1040,918" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="1070" y="882.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2557d6" text-anchor="start">Yes</text><rect x="880" y="920" width="960" height="140" rx="16" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="1360.0" y="948.3" font-family="Arial,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Rank and return</text><text x="1360.0" y="985.9" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Preference matches first; label other venues as alternatives.</text><text x="1360.0" y="1014.5" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">No preferences: valid offers, spare time, then name.</text><text x="1360.0" y="1043.1" font-family="Arial,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#dbe6fd" text-anchor="middle">Show source-backed offers, estimates and warnings.</text><rect x="60" y="920" width="680" height="140" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="400.0" y="963.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">Source facts and estimates</text><text x="400.0" y="1000.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">Food-only dietary checks; unknown hours are labelled.</text><text x="400.0" y="1027.3" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">Only fresh, visit-valid offers affect ranking.</text><path d="M740,990 L878,990" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="60" y="1106.8" font-family="Arial,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">Activity notation: rounded boxes are actions/outcomes; diamonds are decisions; branches carry guards.</text><text x="60" y="1153.6" font-family="Arial,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#4b5563" text-anchor="start" letter-spacing="1.2">LEGEND</text><rect x="60.0" y="1178" width="28" height="23" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/><text x="102.0" y="1192.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Decisions and review</text><rect x="510.0" y="1178" width="28" height="23" rx="4" fill="#dbe6fd" stroke="#9db4ee" stroke-width="2"/><text x="552.0" y="1192.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Application processing</text><rect x="960.0" y="1178" width="28" height="23" rx="4" fill="#111827" stroke="#111827" stroke-width="2"/><text x="1002.0" y="1192.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Persisted data</text><rect x="1410.0" y="1178" width="28" height="23" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="1452.0" y="1192.2" font-family="Arial,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4b5563" text-anchor="start">Managed/external services and notes</text><path d="M60.0,1243 L108.0,1243" fill="none" stroke="#2557d6" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2557d6)"/><text x="125.0" y="1244.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Traveller request / result</text><path d="M660.0,1243 L708.0,1243" fill="none" stroke="#21735a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah21735a)"/><text x="725.0" y="1244.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Catalogue preparation</text><path d="M1260.0,1243 L1308.0,1243" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah4b5563)"/><text x="1325.0" y="1244.0" font-family="Arial,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#4b5563" text-anchor="start">Supporting flow / dependency</text></svg>